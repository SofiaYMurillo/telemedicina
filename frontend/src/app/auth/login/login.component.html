<section class="container">
  <div class="page-title">
    <h1>Iniciar sesión</h1>
    <p>Accede al sistema HealthTech de telemedicina y triaje.</p>
  </div>

  <div class="card" style="max-width: 520px;">
    @if (error()) {
      <div class="alert error">{{ error() }}</div>
    }

    <form class="form-grid" (ngSubmit)="submit()">
      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" required>
      </label>

      <label>
        Contraseña
        <input name="password" type="password" [(ngModel)]="password" required>
      </label>

      <button class="btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="muted">¿No tienes cuenta? <a routerLink="/register"><strong>Regístrate</strong></a></p>
  </div>
</section>
