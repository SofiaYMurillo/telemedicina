services:
  postgres:
    image: postgres:16
    container_name: meditriage-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthtech}
      POSTGRES_USER: ${POSTGRES_USER:-healthtech_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthtech_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthtech_user -d healthtech"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: meditriage-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthtech}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-healthtech_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-healthtech_pass}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-change-this-secret-key}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

  frontend:
    build:
      context: ./frontend
    container_name: meditriage-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"

volumes:
  postgres_data:
